server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

media:
  provider: ${MEDIA_PROVIDER:unavailable}
  ytdlp:
    executable: ${YTDLP_EXECUTABLE:yt-dlp}
    timeout-seconds: ${YTDLP_TIMEOUT_SECONDS:30}
    download-timeout-seconds: ${YTDLP_DOWNLOAD_TIMEOUT_SECONDS:120}
    maximum-download-bytes: ${YTDLP_MAX_DOWNLOAD_BYTES:52428800}

reelsave:
  cors:
    allowed-origins: ${REELSAVE_CORS_ALLOWED_ORIGINS:}
  rate-limit:
    enabled: ${REELSAVE_RATE_LIMIT_ENABLED:true}
    requests-per-window: ${REELSAVE_RATE_LIMIT_REQUESTS_PER_WINDOW:30}
    window-seconds: ${REELSAVE_RATE_LIMIT_WINDOW_SECONDS:60}
    maximum-clients: ${REELSAVE_RATE_LIMIT_MAX_CLIENTS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${REELSAVE_LOGGING_LEVEL_ROOT:INFO}
