services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reelsave-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MEDIA_PROVIDER=ytdlp
      - YTDLP_EXECUTABLE=/usr/local/bin/yt-dlp
      - YTDLP_TIMEOUT_SECONDS=30
      - YTDLP_DOWNLOAD_TIMEOUT_SECONDS=120
      - YTDLP_MAX_DOWNLOAD_BYTES=52428800
      - REELSAVE_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,https://reelsave-five.vercel.app
      - REELSAVE_RATE_LIMIT_ENABLED=true
      - REELSAVE_RATE_LIMIT_REQUESTS_PER_WINDOW=30
      - REELSAVE_RATE_LIMIT_WINDOW_SECONDS=60
      - REELSAVE_RATE_LIMIT_MAX_CLIENTS=10000
      - REELSAVE_LOGGING_LEVEL_ROOT=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reelsave-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
